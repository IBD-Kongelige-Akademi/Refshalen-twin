name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Nothing to publish until the packed Aalborg data has a host: set the repository variable DATA_URL (phase 7)
    if: ${{ vars.DATA_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        env:
          # Citywide data (tiles, city, facade atlases) lives on a static host with HTTP Range (Cloudflare R2 with a custom domain),
          # not in the Pages artifact (1 GB limit), packed (tools/hosting/build_packs.py, upload_packs.py): manifest.json (no-cache)
          # + content-hashed packs, so republishing only replaces the manifest and no version prefix is needed.
          DATA_URL: ${{ vars.DATA_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html credits.html _site/
          cp -R css js _site/
          # Pages serves code only: the engine reads everything through js/data-config.js; point its data base at DATA_URL
          sed -i "s|^export const BUILD_DATA_BASE = .*|export const BUILD_DATA_BASE = '${DATA_URL%/}';|" _site/js/data-config.js
          grep -q "BUILD_DATA_BASE = 'https://" _site/js/data-config.js
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
